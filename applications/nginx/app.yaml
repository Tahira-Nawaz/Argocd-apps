apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  sources:
    - repoURL: https://helm.nginx.com/stable
      chart: nginx
      targetRevision: 2.2.2
      helm:
        releaseName: nginx
        valueFiles:
          - $values/applications/nginx/values.yaml

    - repoURL: https://github.com/Tahira-Nawaz/Argocd-apps.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
